[package]
name = "kanstack-recipe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Orchestrator that drives kanstack's CLI/JSON contract to run a Markdown+YAML recipe DAG."

[lib]
name = "kanstack_recipe"
path = "src/lib.rs"

[[bin]]
name = "kanstack-recipe"
path = "src/main.rs"

[dependencies]
# flock(2) for the one-orchestrator-per-repo lock (src/lock.rs); kanstack already depends on it.
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"

# Not shipped by `dist` yet: it lives in kanstack's workspace but isn't part of a release.
[package.metadata.dist]
dist = false
