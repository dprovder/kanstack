[package]
name = "kanstack-tracker"
version = "0.1.0"
edition = "2021"
publish = false
description = "The issue-tracker seam behind kanstack's queue: a Tracker trait and its backends."

[lib]
name = "kanstack_tracker"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
# flock(2) for the per-item lock (src/local.rs); kanstack and kanstack-recipe already use it.
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
# Remote backends parse their CLIs' JSON output (`gh ... --json`).
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

# Not shipped by `dist`: a library the orchestrator and the TUI link against, not a release.
[package.metadata.dist]
dist = false
