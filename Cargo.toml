[package]
name = "kanstack"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "An unofficial kanban-style terminal UI for the GitButler CLI"
license = "MIT"
repository = "https://github.com/danielprovder/kanstack"
readme = "README.md"

[lib]
name = "kanstack"
path = "src/lib.rs"

[[bin]]
name = "kanstack"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = true
