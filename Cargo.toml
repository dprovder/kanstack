[package]
name = "kanstack"
version = "0.0.2"
edition = "2021"
rust-version = "1.82"
description = "An unofficial kanban-style terminal UI for the GitButler CLI"
license = "MIT"
repository = "https://github.com/dprovder/kanstack"
homepage = "https://github.com/dprovder/kanstack"
readme = "README.md"

[lib]
name = "kanstack"
path = "src/lib.rs"

[[bin]]
name = "kanstack"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
# Filesystem watching, so the board follows the repo instead of waiting for a keypress.
ignore = "0.4"
notify = "8"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
